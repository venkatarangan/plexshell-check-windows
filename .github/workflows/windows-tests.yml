name: Windows PowerShell tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Profile discovery and reporting
        shell: ${{ matrix.shell }}
        run: |
          & ./tests/Test-ProfileDiscovery.ps1
          & ./tests/Test-Reporting.ps1
